<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bontà share card</title>
<!-- Source for ../og-image.png, the picture shown when the site link is shared.
     Re-render with: node tools/render-og.mjs -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600&family=Cormorant+Garamond:wght@600&family=Dancing+Script:wght@700&display=swap">
<style>
  :root { --wall: #F3DFA4; --paper: #FFFCF4; --green: #1F5A4C; --green-deep: #153F35; --sage: #86A98F; --terracotta: #8E4636; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: radial-gradient(circle at 80% 10%, rgba(255, 252, 244, .55), transparent 55%), var(--wall);
    color: var(--green-deep); font-family: "Be Vietnam Pro", system-ui, sans-serif;
  }
  .awning {
    position: absolute; left: 0; right: 0; top: 0; height: 30px;
    background: repeating-linear-gradient(90deg, var(--green) 0 32px, var(--paper) 32px 64px);
    -webkit-mask: radial-gradient(circle at 16px 14px, #000 15.5px, transparent 16px) 0 0 / 32px 100% repeat-x, linear-gradient(#000 0 0) top / 100% 14px no-repeat;
  }
  .copy { position: absolute; left: 80px; top: 92px; width: 640px; display: grid; gap: 18px; justify-items: start; }
  .logo { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 64px; letter-spacing: .16em; line-height: 1; color: var(--green); }
  .tag { margin-top: -8px; font-weight: 600; font-size: 15px; letter-spacing: .34em; text-transform: uppercase; color: #56625B; }
  h1 { margin: 26px 0 0; font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 74px; line-height: 1; letter-spacing: -.01em; }
  .script { font-family: "Dancing Script", cursive; font-weight: 700; font-size: 38px; color: var(--terracotta); }
  .window {
    position: absolute; right: 90px; top: 64px;
    width: 330px; height: 470px; padding: 12px;
    background: var(--sage); border-radius: 999px 999px 10px 10px;
    box-shadow: 0 34px 60px -30px rgba(29, 43, 37, .5);
  }
  .window img { width: 100%; height: 100%; object-fit: cover; border-radius: 999px 999px 3px 3px; display: block; }
  .tiles { position: absolute; left: 0; bottom: 0; width: 100%; height: 44px; }
</style>
</head>
<body>
  <div class="awning"></div>
  <div class="copy">
    <span class="logo">BONTÀ</span>
    <span class="tag">Pizza · Pasta · Cafe</span>
    <h1>Handmade pasta in Biên Hòa</h1>
    <span class="script">Benvenuti!</span>
  </div>
  <div class="window"><img src="../images/carbonara.jpg" alt=""></div>
  <svg class="tiles" aria-hidden="true">
    <defs>
      <pattern id="t" width="44" height="44" patternUnits="userSpaceOnUse">
        <rect width="44" height="44" fill="#1F5A4C"/>
        <g fill="#FFFCF4">
          <circle cx="17.4" cy="22" r="5.4"/><circle cx="26.6" cy="22" r="5.4"/><circle cx="22" cy="17.4" r="5.4"/><circle cx="22" cy="26.6" r="5.4"/>
          <circle cx="-4.6" cy="0" r="5.4"/><circle cx="4.6" cy="0" r="5.4"/><circle cx="0" cy="4.6" r="5.4"/>
          <circle cx="39.4" cy="0" r="5.4"/><circle cx="48.6" cy="0" r="5.4"/><circle cx="44" cy="4.6" r="5.4"/>
          <circle cx="-4.6" cy="44" r="5.4"/><circle cx="4.6" cy="44" r="5.4"/><circle cx="0" cy="39.4" r="5.4"/>
          <circle cx="39.4" cy="44" r="5.4"/><circle cx="48.6" cy="44" r="5.4"/><circle cx="44" cy="39.4" r="5.4"/>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#t)"/>
  </svg>
</body>
</html>
